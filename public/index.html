  const w=n=>addDays(fmt(mondayOf(new Date())),n*7);
  const A=[
   ['t1','p1',w(0),addDays(w(1),4),4],['t1','p4',w(1),addDays(w(2),4),4],['t1','p2',w(3),addDays(w(4),4),6],

let myRole=null,myId=null,me=null,isOwnerFlag=false,usersReady=false,bootWrote=false,usersDraw=null;
const BOOT=[];
const rank={contributor:1,manager:2,admin:3};

const STG={active:'Active',hired:'Hired, starting soon',offer:'Offer made',interview:'Interviewing',screening:'Screening',sourcing:'Sourcing',inactive:'Inactive',archived:'Archived'};

const matches=p=>(!filterQ||personProjectMatch(p)||(p.name+' '+(p.role||'')+' '+(p.emp||'')+' '+(p.stage&&p.stage!=='active'?STG[p.stage]:'')+' '+(p.skills||[]).join(' ')).toLowerCase().includes(filterQ))&&(!skillSel.size||(p.skills||[]).some(s=>skillSel.has(s)));
const sortedPeople=()=>{const l=state.people.filter(matches).filter(p=>!pf||state.allocs.some(a=>a.person===p.id&&visAlloc(a)));if(sortBy==='name')l.sort((a,b)=>a.name.localeCompare(b.name));else if(sortBy==='name-desc')l.sort((a,b)=>b.name.localeCompare(a.name));else if(sortBy==='title')l.sort((a,b)=>(a.role||'~').localeCompare(b.role||'~')||a.name.localeCompare(b.name));return l};
let db=null,readOnly=false,synced=false,dirty=false;
function loadLocal(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}

function put(kind,obj){recordOwnership(kind,obj);captureEdit(kind,obj.id,obj);if(!db){shadow[kind+'/'+obj.id]=JSON.stringify(historyValue(obj));saveLocal();return}const r={...obj};delete r.id;db.collection(kind).doc(obj.id).set(r).catch(fail);logChange(kind,obj.id,r)}

function sortAll(){state.clients.sort((a,b)=>(a.n||0)-(b.n||0));state.projects.sort((a,b)=>(a.leave?1:0)-(b.leave?1:0)||(a.n||0)-(b.n||0));state.people.sort((a,b)=>(a.n||0)-(b.n||0)||a.name.localeCompare(b.name))}

async function connect(){
  try{
    const c=window.claude&&claude.use?await claude.use('db'):null;
    const u=window.claude&&claude.use?await claude.use('user'):null;
    try{if(u&&(await u.can('data.write'))===false)readOnly=true}catch(e){}
    if(!c){state=Object.assign({clients:[],holidays:[]},loadLocal()||seed());setStatus('Local only (this browser)');myRole='admin';document.body.dataset.role='admin';render();goToday();return}
    db=c;
    try{if(u){myId=await u.id();me=await u.me();isOwnerFlag=await u.isOwner()}}catch(e){}
    db.collection('users').onSnapshot(s=>{s.docs.forEach(d=>shadow['users/'+d.id]=JSON.stringify(d.data()));state.users=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.n||0)-(b.n||0));usersReady=true;evalAccess();renderGate();if(usersDraw)usersDraw()},fail);
    setStatus('Shared · live');
    ['clients','holidays','projects','people','allocs'].forEach(k=>db.collection(k).onSnapshot(s=>{state[k]=s.docs.map(d=>({id:d.id,...d.data()}));s.docs.forEach(d=>shadow[k+'/'+d.id]=JSON.stringify(d.data()));synced=true;refresh()},fail));
  }catch(e){state=Object.assign({clients:[],holidays:[]},loadLocal()||seed());setStatus('Local only (this browser)');myRole='admin';document.body.dataset.role='admin';render()}
}
let range={start:addDays(fmt(mondayOf(new Date())),-28),weeks:30};
let cols=[];

function buildCols(){cols=[];let d=parse(range.start);for(let w=0;w<range.weeks;w++){for(let i=0;i<7;i++){cols.push(fmt(d));d.setDate(d.getDate()+1)}}}
function lowerBound(iso){let lo=0,hi=cols.length;while(lo<hi){const m=(lo+hi)>>1;if(cols[m]<iso)lo=m+1;else hi=m}return lo}
function span(a){const s=lowerBound(a.start);let e=lowerBound(a.end);if(e>=cols.length||cols[e]>a.end)e--;return(s>e||s>=cols.length||e<0)?null:[s,e]}
const proj=id=>state.projects.find(p=>p.id===id);
const client=id=>state.clients.find(c=>c.id===id);
const colorOf=p=>p.leave?'#9aa1b5':(client(p.clientId)?.color||p.color||'#5c6370');
const labelOf=p=>{const c=client(p.clientId);return c?c.name+' / '+p.name:p.name};
const isLinked=p=>!!p&&!p.leave&&!!client(p.clientId);
function isCRMTeamSupport(p){if(!p||p.leave)return false;const name=labelOf(p).normalize('NFKC').toLowerCase().replace(/[^a-z0-9]+/g,' ');return /\b(?:the )?crm team\b/.test(name)&&/\bsupport\b/.test(name)}
const eff=a=>{const pr=proj(a.proj);return isLinked(pr)&&pr.start&&pr.end&&!a.own?{...a,start:pr.start,end:pr.end}:a};
const visAlloc=a=>{if(filterQ&&!personTextMatch(a.person)&&!projectSearchMatch(a.proj))return false;if(!pf)return true;const pr=proj(a.proj);if(!pr)return false;return pf[0]==='c'?pr.clientId===pf.slice(2):a.proj===pf.slice(2)};
let offA=[],holMap={};
const nextWork=(i,dir)=>{i=Math.max(0,Math.min(i,cols.length-1));while(i>=0&&i<cols.length&&offA[i])i+=dir;return i<0||i>=cols.length?-1:i};
const addWork=(a,n)=>{let i=a,k=1;while(k<n){const j=nextWork(i+1,1);if(j<0)break;i=j;k++}return i};
const wcount=(a,b)=>{let k=0;for(let i=a;i<=b;i++)if(!offA[i])k++;return Math.max(1,k)};
const segs=(a,b,off)=>{off=off||offA;const r=[];let s=-1;for(let i=a;i<=b+1;i++){const w=i<=b&&!off[i];if(w&&s<0)s=i;if(!w&&s>=0){r.push([s,i-1]);s=-1}}return r};
let wdA=[],lastDragEnd=0;
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const daysOf=p=>{if(p.days)return p.days;const c=p.cap||8;return{1:c,2:c,3:c,4:c,5:c}};
const capOn=(p,i)=>offA[i]===2?0:(Number(daysOf(p)[wdA[i]])||0);
const maxCap=p=>{const m=Math.max(0,...Object.values(daysOf(p)).map(Number));return m||p.cap||8};
function dayLabel(p){
  const o=[1,2,3,4,5,6,0].filter(d=>(Number(daysOf(p)[d])||0)>0);
  if(o.join()==='1,2,3,4,5')return '';
  const runs=[];for(const d of o){const l=runs[runs.length-1];if(l&&(l[l.length-1]+1)%7===d)l.push(d);else runs.push([d])}
  return runs.map(r=>r.length>2?DN[r[0]]+'\u2013'+DN[r[r.length-1]]:r.map(d=>DN[d]).join(', ')).join(', ');
}
const unav=(pr,p)=>!!pr.leave&&!!p&&p.emp==='contractor';
const barName=(pr,p)=>unav(pr,p)?'Unavailable':labelOf(pr);
const fmtD=iso=>parse(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
function ago(t){
  const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';
  const m=Math.round(s/60);if(m<60)return m+(m===1?' minute':' minutes')+' ago';
  const h=Math.round(s/3600);if(h<24)return 'about '+h+(h===1?' hour':' hours')+' ago';
  const d=Math.round(s/86400);if(d<30)return d+(d===1?' day':' days')+' ago';
  const mo=Math.round(d/30);return 'about '+mo+(mo===1?' month':' months')+' ago';
}

function teamGroups(people=state.people){
  const groups=new Map();
  for(const person of people){
    const role=(person.role||'').trim();
    const key=role.toLowerCase().replace(/\s+/g,' ');
    const aliases={'solution architect':'Solutions Architects','solutions architect':'Solutions Architects','solution architects':'Solutions Architects','solutions architects':'Solutions Architects','delivery manager':'Delivery Managers','delivery managers':'Delivery Managers','developer':'Developers','developers':'Developers','business analyst':'Business Analysts','business analysts':'Business Analysts'};
    const label=aliases[key]||role||'No role assigned';
    const groupKey=label.toLowerCase();if(!groups.has(groupKey))groups.set(groupKey,{label,people:[]});groups.get(groupKey).people.push(person);
  }
  return [...groups.values()].sort((a,b)=>a.label==='No role assigned'?1:b.label==='No role assigned'?-1:a.label.localeCompare(b.label)).map(g=>[g.label,g.people.sort((a,b)=>a.name.localeCompare(b.name))]);
}
function render(){
  sortAll();buildCols();holMap=saHolidays();state.holidays.forEach(h=>holMap[h.id]=h.name||'Public holiday');offA=cols.map(c=>{const g=parse(c).getDay();return g===0||g===6?1:(holMap[c]?2:0)});wdA=cols.map(c=>parse(c).getDay());
  const W=cols.length*DW, el=document.getElementById('content');
  el.style.width=(200+W)+'px';
  // header
  let wk='',dy='';
  for(let w=0;w<range.weeks;w++){
    const d=parse(cols[w*7]);
    const lbl=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    wk+=`<div style="width:${7*DW}px">${d.getDate()<=7||w===0?'<b>'+d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</b> · ':''}${lbl}</div>`;
  }
  cols.forEach((c,i)=>{const d=parse(c);const k=offA[i];dy+=`<div style="width:${DW}px" class="${c===todayISO?'td':''} ${k===1?'we':k===2?'ph':''}" ${k===1?'':`data-hd="${c}" title="${esc(k===2?holMap[c]+' (click to edit)':'Click to mark as a public holiday')}"`}>${'MTWTFSS'[(d.getDay()+6)%7]}<b>${d.getDate()}</b></div>`});
  let html=`<div class="hrow"><div class="corner" style="align-items:center;gap:5px;flex-wrap:wrap"><span style="flex:1">${state.people.filter(matches).length} of ${state.people.length} people</span><button type="button" data-resource-expand-all aria-label="Expand all displayed resource rows" title="Expand all resource rows" style="padding:2px 7px">+</button><button type="button" data-resource-collapse-all aria-label="Collapse all displayed resource rows" title="Collapse all resource rows" style="padding:2px 7px">&minus;</button></div><div class="hdr" style="width:${W}px"><div class="wk">${wk}</div><div class="dy">${dy}</div></div></div>`;
  const tIdx=cols.indexOf(todayISO);
  const weekStart=visibleWeek();const thisWk=cols.map((c,i)=>[c,i]).filter(([c])=>c>=weekStart&&c<=addDays(weekStart,6)).map(x=>x[1]).filter(i=>offA[i]!==2);
  sortedPeople().forEach(p=>{
    const mine=state.allocs.filter(a=>a.person===p.id).filter(visAlloc).map(a=>({a,s:span(eff(a))})).filter(x=>x.s).sort((x,y)=>x.s[0]-y.s[0]);
    const offP=cols.map((c,i)=>!capOn(p,i));const stk=new Array(cols.length).fill(0),day={},dayAll={};
    mine.forEach(x=>{let y=0;for(let i=x.s[0];i<=x.s[1];i++)y=Math.max(y,stk[i]);x.y=y;for(let i=x.s[0];i<=x.s[1];i++){stk[i]=y+x.a.hrs;if(!offP[i]){dayAll[i]=(dayAll[i]||0)+x.a.hrs;if(!proj(x.a.proj)?.leave)day[i]=(day[i]||0)+x.a.hrs}}
      });
    const peak=Math.max(maxCap(p),...stk),PPH=22;
    const collapsed=!!collapsedResources[p.id];let h=collapsed?44:(rowH[p.id]?Math.max(44,rowH[p.id]):PAD*2+peak*PPH);
    const pph=Math.max(.01,(h-PAD*2)/Math.max(1,peak));
    // Pack actual rendered pixels per working day, including the minimum bar height.
    const pixelStack=new Array(cols.length).fill(PAD);
    mine.forEach(x=>{x.height=Math.max(24,Number(x.a.hrs)*pph);x.parts=[];
      for(let i=x.s[0];i<=x.s[1];i++){if(offP[i])continue;const y=pixelStack[i];pixelStack[i]+=x.height;
        const last=x.parts[x.parts.length-1];if(last&&last[1]===i-1&&Math.abs(last[2]-y)<.001)last[1]=i;else x.parts.push([i,i,y]);
      }
    });
    if(!collapsed)h=Math.max(h,...pixelStack.map(y=>y+PAD));
    let util=0;thisWk.forEach(i=>util+=day[i]||0);let capw=0;thisWk.forEach(i=>capw+=capOn(p,i));const pct=Math.round(util/Math.max(1,capw)*100);const flag=weeklyFlag(p,weekStart);
    let tr='';
    if(tIdx>=0)tr+=`<div class="col-td" style="left:${tIdx*DW}px;width:${DW}px"></div>`;
    for(const i in dayAll)if(dayAll[i]>capOn(p,i)+0.001)tr+=`<div class="ov" style="left:${i*DW}px;width:${DW}px"></div>`;
    for(let w=0;w<range.weeks;w++)tr+=`<div class="wkl" style="left:${w*7*DW}px"></div>`;
    cols.forEach((c,i)=>{if(offP[i])tr+=`<div class="off${offA[i]===2?' hol':''}" style="left:${i*DW}px;width:${DW}px"></div>`});
    cols.forEach((date,i)=>{const leave=state.allocs.filter(a=>a.person===p.id&&proj(a.proj)?.leave&&eff(a).start<=date&&eff(a).end>=date).reduce((n,a)=>n+Number(a.hrs||0),0);if(leave>=8)tr+=`<div class="leave-day" style="left:${i*DW}px;width:${DW}px" title="Full day unavailable"></div>`});

const shadow={};
const undoStack=[],redoStack=[];let pendingEdit=null,replaying=false;
const historyKinds=new Set(['clients','projects','people','allocs','holidays']);
const copyEdit=x=>x==null?null:JSON.parse(JSON.stringify(x));
const historyValue=x=>{if(!x)return null;const r=copyEdit(x);delete r.id;return r};
const historyKey=value=>JSON.stringify(value,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.keys(v).sort().map(k=>[k,v[k]])):v);
function historyButtons(){document.getElementById('undo').disabled=replaying||!undoStack.length||!atLeast('manager');document.getElementById('redo').disabled=replaying||!redoStack.length||!atLeast('manager')}
function finishEdit(){if(!pendingEdit)return;const changes=[...pendingEdit.values()].filter(c=>historyKey(c.before)!==historyKey(c.after));pendingEdit=null;if(changes.length){undoStack.push(changes);if(undoStack.length>100)undoStack.shift();redoStack.length=0}historyButtons()}
function captureEdit(kind,id,obj){if(replaying||!historyKinds.has(kind))return;const key=kind+'/'+id;if(!pendingEdit){pendingEdit=new Map();queueMicrotask(finishEdit)}const before=shadow[key]?JSON.parse(shadow[key]):null;const change=pendingEdit.get(key)||{kind,id,before:copyEdit(before)};change.after=historyValue(obj);pendingEdit.set(key,change)}
async function replayEdit(redo=false){finishEdit();if(replaying||!atLeast('manager'))return;const source=redo?redoStack:undoStack,target=redo?undoStack:redoStack,entry=source[source.length-1];if(!entry)return;
  for(const c of entry){const current=historyValue(state[c.kind].find(x=>x.id===c.id));if(historyKey(current)!==historyKey(redo?c.before:c.after)){setStatus('Cannot '+(redo?'redo':'undo')+': this record has changed since your edit.');return}}
  replaying=true;historyButtons();closeModal();closePop();
  try{for(const c of (redo?entry:[...entry].reverse())){const value=copyEdit(redo?c.after:c.before);state[c.kind]=state[c.kind].filter(x=>x.id!==c.id);if(value)state[c.kind].push({id:c.id,...value});if(db){if(value)await db.collection(c.kind).doc(c.id).set(value);else await db.collection(c.kind).doc(c.id).delete();logChange(c.kind,c.id,value)}else{if(value)shadow[c.kind+'/'+c.id]=JSON.stringify(value);else delete shadow[c.kind+'/'+c.id];saveLocal()}}source.pop();target.push(entry);sortAll();render()}catch(e){fail(e);undoStack.length=0;redoStack.length=0}finally{replaying=false;historyButtons()}
}
document.getElementById('undo').onclick=()=>replayEdit(false);document.getElementById('redo').onclick=()=>replayEdit(true);

function describe(kind,id,obj,old){
  const cur=obj||old||{},out=[];
  const pn=i=>{const x=state.people.find(y=>y.id===i);return x?x.name:'someone'};
  const prn=i=>{const x=state.projects.find(y=>y.id===i);return x?labelOf(x):'a project'};
  const chg=k=>old&&obj&&JSON.stringify(old[k])!==JSON.stringify(obj[k]);
  if(kind==='allocs'){
    const w=pn(cur.person),p=prn(cur.proj);
    if(!obj)return `removed ${w} from ${p}`;
    if(!old)return `booked ${w} on ${p} (${obj.hrs}h/day)`;
    if(chg('hrs'))out.push(`changed ${w}'s hours on ${p} from ${old.hrs}h to ${obj.hrs}h/day`);
    if(chg('status'))out.push(`marked ${w} on ${p} as ${obj.status||'confirmed'}`);
    if(chg('comment'))out.push(`edited the comment for ${w} on ${p}`);
    if(chg('person'))out.push(`moved ${p} from ${pn(old.person)} to ${w}`);
    if(chg('proj'))out.push(`changed ${w}'s booking to ${p}`);
    if(chg('start')||chg('end'))out.push(`changed the dates of ${w}'s ${p} booking`);
  }else if(kind==='projects'){
    const n=labelOf(cur);
    if(!obj)return `deleted project ${n}`;
    if(!old)return `added project ${n}`;
    if(chg('start')||chg('end'))out.push(`changed the timeline of ${n} to ${obj.start} – ${obj.end}`);
    if(chg('name'))out.push(`renamed project ${old.name} to ${obj.name}`);
    if(chg('clientId'))out.push(`moved ${obj.name} to another client`);
    if(chg('ownerId'))out.push(`set the owner of ${n} to ${pn(obj.ownerId)}`);
    if(chg('stage'))out.push(`set the stage of ${n} to ${obj.stage}`);
    if(chg('billable'))out.push(`marked ${n} as ${obj.billable===false?'non-billable':'billable'}`);
    if(chg('code'))out.push(`changed the code of ${n}`);
    if(chg('notes'))out.push(`edited the notes for ${n}`);
    if(chg('color')||chg('leave'))out.push(`changed the look of ${n}`);
  }else if(kind==='people'){
    const n=cur.name||'someone';
    if(!obj)return `removed team member ${n}`;
    if(!old)return `added team member ${n}`;
    if(chg('name'))out.push(`renamed ${old.name} to ${obj.name}`);
    if(chg('role'))out.push(`changed the job title of ${n} to ${obj.role||'none'}`);
    if(chg('emp'))out.push(`marked ${n} as ${obj.emp||'permanent'}`);
    if(chg('stage'))out.push(`set the employment status of ${n} to ${STG[obj.stage]||obj.stage}`);
    if(chg('cap'))out.push(`changed the daily capacity of ${n} to ${obj.cap}h`);
    if(chg('days'))out.push(`changed the work days of ${n}`);
    if(chg('skills'))out.push(`changed the skills of ${n}`);
  }else if(kind==='clients'){
    const n=cur.name||'a client';
    if(!obj)return `deleted client ${n}`;
    if(!old)return `added client ${n}`;
    if(chg('name'))out.push(`renamed client ${old.name} to ${obj.name}`);
    if(chg('color'))out.push(`changed the colour of ${n}`);
  }else if(kind==='holidays'){
    return obj?`marked ${id} as a public holiday${obj.name?' ('+obj.name+')':''}`:`removed the public holiday on ${id}`;
  }else if(kind==='users'){
    const n=cur.name||'a user';
    if(!old)return obj.status==='pending'?'requested access':`added ${n} as ${obj.role}`;
    if(chg('status')){if(obj.status==='approved')return `approved ${n} as ${obj.role}`;if(obj.status==='declined')return old.status==='approved'?`removed access for ${n}`:`declined access for ${n}`;return null}
    if(chg('role'))out.push(`changed ${n}'s role from ${old.role} to ${obj.role}`);
  }
  return out.length?out.join('; '):null;
}

function reportRows(R){
  const days=[];for(let d=parse(R.from);fmt(d)<=R.to;d.setDate(d.getDate()+1))days.push(fmt(d));
  const rows=[];
  for(const p of state.people){
    const con=p.emp==='contractor',act=(p.stage||'active')==='active';
    if(R.title&&(p.role||'')!==R.title)continue;
    if(R.emp&&(con?'contractor':'permanent')!==R.emp)continue;
    if(R.status==='active'&&!act)continue;if(R.status==='recruiting'&&act)continue;
    const al=state.allocs.filter(a=>a.person===p.id).map(a=>({a,e:eff(a),pr:proj(a.proj)}));
    const r={p,con,avail:0,cb:0,tb:0,cn:0,tn:0,lv:0,un:0};
    for(const iso of days){
      const cap=holMap[iso]?0:(Number(daysOf(p)[parse(iso).getDay()])||0);
      if(!cap)continue;
      r.avail+=cap;
      for(const x of al){
        if(!x.e.start||iso<x.e.start||iso>x.e.end)continue;
        const h=Number(x.a.hrs)||0;
        if(x.pr&&x.pr.leave){if(con)r.un+=h;else r.lv+=h;continue}
        const bill=!!x.pr&&x.pr.billable!==false&&isLinked(x.pr),ten=effectiveBookingStatus(x.a)==='tentative';
        r[(ten?'t':'c')+(bill?'b':'n')]+=h;
      }
    }
    r.booked=r.cb+r.tb+r.cn+r.tn;
    r.free=Math.max(0,r.avail-r.booked-r.lv-r.un);
    r.util=r.avail?Math.round(r.booked/r.avail*100):0;
    rows.push(r);
  }
  return rows;
}

function csvRows(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
const FMON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const fIso=s=>{const m=/^(\d{1,2}) (\w{3}) (\d{4})$/.exec(String(s||'').trim());return m&&FMON[m[2]]!=null?m[3]+'-'+pad(FMON[m[2]]+1)+'-'+pad(+m[1]):null};
function parseFloatExport(text){
  const rows=csvRows(text),hi=rows.findIndex(r=>(r[0]||'').trim()==='Name');
  if(hi<0)throw new Error('This does not look like a Float export (no "Name" column was found).');
  const account=((rows[0]||[])[0]||'').trim();
  const dates=rows[hi].slice(8).map(fIso);
  if(!dates.some(Boolean))throw new Error('No date columns were found in this file.');
  const people=new Map(),raw=[],hols=[];let inHol=false;
  for(const r of rows.slice(hi+1)){
    if(!r.some(x=>x&&x.trim()))continue;
    const c=r.slice(0,8).map(x=>(x||'').trim()),[name,role,dept,task,project,client,off]=c;
    if(name==='Holiday'){inHol=true;continue}
    if(inHol){const a=fIso(role),b=fIso(dept)||a;if(a)hols.push({name,a,b});continue}
    if(!name||name==='SCHEDULED'||name==='CAPACITY')continue;
    if(!people.has(name))people.set(name,{name,role,dept});
    if(project||off)raw.push({c,vals:r.slice(8)});
  }
  const holidays=[],sa=new Set();
  for(const h of hols){
    const isSa=/\(South Africa\)/i.test(h.name),nm=h.name.replace(/\s*\(South Africa\)\s*$/i,'');
    for(let d=new Date(h.a+'T00:00');fmt(d)<=h.b;d.setDate(d.getDate()+1)){holidays.push({iso:fmt(d),name:nm,sa:isSa});if(isSa)sa.add(fmt(d))}
  }
  const bookings=[],leave=[];
  for(const {c,vals} of raw){
    const [name,,,task,project,client,off,notes]=c;
    const comment=[task,notes].filter(Boolean).join(' - ').replace(/\s*\n\s*/g,' / ');
    let run=null;
    const flush=()=>{if(!run)return;
      if(off)leave.push({person:name,type:off,comment,start:run.s,end:run.e,hrs:run.h});
      else bookings.push({person:name,client,project,comment,start:run.s,end:run.e,hrs:run.h});
      run=null};
    vals.forEach((x,i)=>{
      const iso=dates[i];if(!iso)return;
      const h=Math.round((parseFloat(x)||0)*100)/100,wd=new Date(iso+'T00:00').getDay();
      if((wd===0||wd===6||sa.has(iso))&&h===0)return;
      if(h>0&&run&&run.h===h)run.e=iso;else{flush();if(h>0)run={s:iso,e:iso,h}}
    });

function buildFloatOps(P,o){
  const ops=[],set=(coll,id,data)=>ops.push({op:'set',coll,id,data}),del2=(coll,id)=>ops.push({op:'delete',coll,id});
  const slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,34);
  const h36=t=>{let h=2166136261;for(const ch of String(t)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
  const st={newPeople:0,newClients:0,newProjects:0,bookings:0,leave:0,holidays:0,removed:0};
  let n=Date.now();
  if(o.all){state.allocs.forEach(a=>{del2('allocs',a.id);st.removed++})}
  else if(o.replace){state.allocs.filter(a=>String(a.id).startsWith('fa_')).forEach(a=>{del2('allocs',a.id);st.removed++})}
  const pid=new Map(state.people.map(p=>[p.name.trim().toLowerCase(),p.id]));
  for(const p of P.people){const k=p.name.toLowerCase();if(pid.has(k))continue;
    const id='fp_'+slug(p.name)+'_'+h36(p.name);
    set('people',id,{name:p.name,role:p.role||'',cap:8,emp:'permanent',stage:'active',skills:p.dept?[p.dept]:[],n:n++});pid.set(k,id);st.newPeople++}
  const cid=new Map(sortedClients().map(c=>[c.name.trim().toLowerCase(),c.id]));
  const clientId=name=>{const k=name.toLowerCase();if(cid.has(k))return cid.get(k);
    const id='fc_'+slug(name)+'_'+h36(name);set('clients',id,{name,color:PALETTE[((state.clients.length+st.newClients)*5)%PALETTE.length],n:n++});cid.set(k,id);st.newClients++;return id};
  const span=new Map();
  for(const b of P.bookings){const k=b.client.toLowerCase()+'|'+b.project.toLowerCase(),s=span.get(k)||{s:b.start,e:b.end};if(b.start<s.s)s.s=b.start;if(b.end>s.e)s.e=b.end;span.set(k,s)}
  const prj=new Map();
  const projectId=(client,name)=>{
    const k=client.toLowerCase()+'|'+name.toLowerCase();if(prj.has(k))return prj.get(k);
    const cI=client?clientId(client):'';
    const ex=state.projects.find(p=>(p.clientId||'')===cI&&p.name.trim().toLowerCase()===name.toLowerCase()&&!p.leave);
    let id;
    if(ex){id=ex.id;if(!ex.start){const {id:_,hist:__,...rest}=ex;set('projects',id,{...rest,start:span.get(k).s,end:span.get(k).e})}}
    else{id='fj_'+slug(client+' '+name)+'_'+h36(k);
      const d={name,clientId:cI,stage:'Active',billable:!!client&&client!==P.account,n:n++};
      if(cI){d.start=span.get(k).s;d.end=span.get(k).e}else d.color=PALETTE[(state.projects.length*7)%PALETTE.length];
      set('projects',id,d);st.newProjects++}
    prj.set(k,id);return id};
  for(const b of P.bookings){
    const pI=projectId(b.client,b.project),perId=pid.get(b.person.toLowerCase());
    const d={person:perId,proj:pI,hrs:b.hrs,start:b.start,end:b.end};
    if(b.client)d.own=true;
    if(b.comment)d.comment=b.comment;
    set('allocs','fa_'+uid(),d);st.bookings++}
  if(o.leave&&P.leave.length){
    let lv=state.projects.find(p=>p.leave);
    if(!lv){lv={id:'lv'};set('projects','lv',{name:'Leave',leave:true,color:'#9aa1b5',n:n++})}
    for(const l of P.leave){
      const d={person:pid.get(l.person.toLowerCase()),proj:lv.id,hrs:l.hrs,start:l.start,end:l.end,comment:l.type+(l.comment?' - '+l.comment:'')};
      set('allocs','fa_'+uid(),d);st.leave++}}
  if(o.hol){const have=new Set(state.holidays.map(h=>h.id));
    for(const h of P.holidays){if(!(h.sa||o.non)||have.has(h.iso))continue;have.add(h.iso);set('holidays',h.iso,{name:h.name});st.holidays++}}
  return{ops,st};
}

let session=null;
const API=async(path,body)=>{
  const r=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&session){location.reload()}
  if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{code:r.status});
  return j;
};
function makeDB(){
  let rev=-1,store={},loaded=false,timer=null,pendingWrites=0,changeEpoch=0,pollSequence=0;let writeQueue=Promise.resolve();const subs=[];
  const docsOf=(coll,o)=>{
    let a=Object.entries(store[coll]||{}).map(([id,v])=>({id,data:()=>v}));
    if(o&&o.by)a.sort((x,y)=>{const p=x.data()[o.by],q=y.data()[o.by];return(o.dir==='desc'?-1:1)*(p>q?1:p<q?-1:0)});
    if(o&&o.n)a=a.slice(0,o.n);
    return a;
  };
  const fire=()=>subs.forEach(s=>s.cb({docs:docsOf(s.coll,s.o)}));
  const poll=async()=>{
    const epoch=changeEpoch,sequence=++pollSequence;
    try{const j=await API('/api/data?rev='+rev);if(pendingWrites||epoch!==changeEpoch||sequence!==pollSequence)return;
      if(j.online)showPresence(j.online);if(j.changed){store=j.data;rev=j.rev;loaded=true;fire()}else if(!loaded){loaded=true;fire()}}
    catch(e){subs.forEach(s=>s.err&&s.err(e))}
  };
  const soon=()=>{clearTimeout(timer);timer=setTimeout(poll,500)};
  const write=ops=>{pendingWrites++;changeEpoch++;const result=writeQueue.catch(()=>{}).then(()=>API('/api/data',{ops}));writeQueue=result;return result.catch(e=>{rev=-1;throw e}).finally(()=>{pendingWrites--;changeEpoch++;if(!pendingWrites)soon()})};
  const coll=(name,o={})=>({
    doc:id=>({
      set:obj=>{(store[name]=store[name]||{})[id]=obj;fire();return write([{op:'set',coll:name,id,data:obj}])},
      delete:()=>{if(store[name])delete store[name][id];fire();return write([{op:'delete',coll:name,id}])}
    }),
    onSnapshot:(cb,err)=>{subs.push({coll:name,o,cb,err});if(loaded)cb({docs:docsOf(name,o)});return()=>{}},
    orderBy:(by,dir)=>coll(name,{...o,by,dir}),
    limit:n=>coll(name,{...o,n})
  });
  poll();
  setInterval(()=>{if(!document.hidden)poll()},5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  return{collection:n=>coll(n),
    refresh:()=>{rev=-1;poll()},
    batch:async(ops,cb)=>{for(const op of ops)captureEdit(op.coll,op.id,op.op==='delete'?null:op.data);for(let i=0;i<ops.length;i+=25){const chunk=ops.slice(i,i+25);await write(chunk);for(const op of chunk){store[op.coll]??={};if(op.op==='delete')delete store[op.coll][op.id];else store[op.coll][op.id]=copyEdit(op.data)}fire();if(cb)cb(Math.min(ops.length,i+25),ops.length)}rev=-1;poll()}};
}

const holidayCache={};
function saHolidays(start=range.start,weeks=range.weeks){const result={};const from=Math.max(1995,parse(start).getFullYear()-1),to=Math.min(2100,parse(addDays(start,weeks*7)).getFullYear()+1);for(let year=from;year<=to;year++){if(!holidayCache[year]){const days={};const add=(date,name)=>{days[date]=days[date]?days[date]+' / '+name:name};for(const [md,name] of [['01-01',"New Year's Day"],['03-21','Human Rights Day'],['04-27','Freedom Day'],['05-01',"Workers' Day"],['06-16','Youth Day'],['08-09',"National Women's Day"],['09-24','Heritage Day'],['12-16','Day of Reconciliation'],['12-25','Christmas Day'],['12-26','Day of Goodwill']]){const date=year+'-'+md;add(date,name);if(parse(date).getDay()===0)add(addDays(date,1),name+' (observed)')}const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=(h+l-7*m+114)%31+1,easter=fmt(new Date(year,month-1,day));add(addDays(easter,-2),'Good Friday');add(addDays(easter,1),'Family Day');holidayCache[year]=days}Object.assign(result,holidayCache[year])}if(from<=2026&&to>=2026)result['2026-11-04']='Local Government Election Day';return result}
