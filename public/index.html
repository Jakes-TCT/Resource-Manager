<!DOCTYPE html>
<html lang="en">

<title>Capacity Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>

.chip{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:5px;border:1px solid var(--line);border-radius:6px;cursor:grab;touch-action:none;user-select:none;background:var(--bg)}

.chip.leave i{background:repeating-linear-gradient(45deg,#9aa1b5 0 2px,transparent 2px 4px)}
.add{display:flex;gap:4px;margin-top:6px}.add input{flex:1}
#scroller{flex:1;overflow:auto;position:relative;background:var(--panel)}
#content{position:relative}
.hrow{display:flex;position:sticky;top:0;z-index:20;background:var(--panel)}
.corner{position:sticky;left:0;z-index:30;width:200px;flex:none;background:var(--panel);border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);display:flex;align-items:flex-end;padding:8px 12px;color:var(--mute);font-size:12px}
.hdr{flex:none;border-bottom:1px solid var(--line2)}
.wk{display:flex;height:24px;border-bottom:1px solid var(--line)}

.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar u{display:block;height:100%;background:var(--accent)}.bar u.o{background:#d9475a}

.al{position:absolute;border-radius:6px;color:#fff;padding:4px 8px;font-size:12px;font-weight:500;overflow:hidden;cursor:grab;touch-action:none;user-select:none;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.al small{opacity:.85;font-size:11px}.al .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al.leave{background:repeating-linear-gradient(45deg,var(--hatch) 0 5px,var(--panel) 5px 10px)!important;color:var(--mute);border:1px solid var(--line2)}

.pop label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px}.pop .r{display:flex;gap:6px;margin-top:12px}
.pop input,.pop select{width:100%}
.danger{color:#c4303f}
.empty{padding:40px;color:var(--mute)}
.al{background:var(--c);border:2px solid color-mix(in srgb,var(--c) 65%,#000)}
.al.tent{background:color-mix(in srgb,var(--c) 30%,var(--panel));border:2px dotted var(--c);color:var(--ink)}
.cg{margin-bottom:12px}.ch{display:flex;align-items:center;gap:6px;margin-bottom:5px}.ch i{width:10px;height:10px;border-radius:50%;flex:none}.ch b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ch button{padding:1px 7px;font-size:12px}
.chip .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.ed{padding:0 6px;border:none;background:none;color:var(--mute)}
.who{cursor:pointer;overflow:hidden}.who:hover{background:var(--bg)}
.rh{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:row-resize;touch-action:none}.rh:hover{background:var(--accent);opacity:.55}
.off{position:absolute;top:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink) 11%,transparent) 0 3px,color-mix(in srgb,var(--ink) 4%,transparent) 3px 7px)}
.off.hol{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink) 20%,transparent) 0 3px,color-mix(in srgb,var(--ink) 7%,transparent) 3px 7px)}
.dy [data-hd]{cursor:pointer}.dy [data-hd]:hover{background:var(--bg)}
.dy .we{background:var(--hatch)}.dy .ph{background:var(--over);color:#c4303f}.dy .ph b{color:#c4303f}
.al.sh{flex-direction:row;align-items:center;gap:8px;padding-top:0;padding-bottom:0}
.rv{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize;touch-action:none}.rv:hover{background:rgba(255,255,255,.4)}
[hidden]{display:none!important}.nopane aside{display:none}
body[data-role=contributor] .add,body[data-role=contributor] [data-eclient],body[data-role=contributor] [data-eproj]{display:none!important}
body:not([data-role=admin]) .adm,body:not([data-role=admin]) [data-rm]{display:none!important}

.tags em.ct{background:#fff3bf;border-color:#f0c93b;color:#7a5b00}.tags em.st{background:#e7f5ff;border-color:#74c0fc;color:#1864ab}
.dpane{position:fixed;right:16px;top:70px;width:330px;max-height:calc(100% - 100px);overflow:auto;z-index:45;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:14px}
.dpane .dh{display:flex;justify-content:space-between;align-items:flex-start;cursor:move}.dpane label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.dpane input,.dpane select,.dpane textarea{width:100%}.dpane textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;resize:vertical}
.dpane .two{display:flex;gap:8px}.dpane .tm{display:flex;gap:6px;align-items:center;margin:4px 0}.dpane .tm span:first-child{flex:1}.dpane .tm input{width:64px}
.lr{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.lr>div:first-child{width:110px;flex:none}
.ur{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}.ur>div{flex:1;min-width:160px}.dlg label.ck{display:flex;gap:6px;align-items:center;margin:0;font-size:12px}.dlg label.ck input{width:auto}
.tg{border:none;background:none;padding:0;width:18px;color:var(--mute);flex:none}
header{flex-wrap:wrap}header select{max-width:160px}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;max-height:34px;overflow:hidden}
.tags em{font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--line2);color:var(--mute)}
.tags.big{max-height:none;margin:0 0 6px}.tags.big em{font-size:12px}.tags a{cursor:pointer;margin-left:3px}
.ov-modal{position:fixed;inset:0;z-index:70;background:rgba(10,12,24,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:18px;width:360px;max-width:100%;max-height:100%;overflow:auto}
.dlg h3{margin:0 0 4px;font-size:16px}.dlg label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}.dlg input,.dlg select{width:100%}.dlg .r{display:flex;gap:6px;margin-top:16px}
.pop textarea{width:100%;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;resize:vertical}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}.sw button.on{border-color:var(--ink)}
.seg{display:flex}.seg button{flex:1;border-radius:0}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (max-width:700px){aside{width:150px}.who,.corner{width:140px}}
@media (prefers-reduced-motion:no-preference){.al{transition:box-shadow .15s}}
.pop{width:290px;max-height:calc(100vh - 16px);overflow:auto}
.as{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:4px;background:var(--panel)}
.pop .as input{flex:1;width:auto;min-width:90px;border:none;padding:3px 4px;outline:none}
.ch2{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:2px 4px 2px 8px;font-size:12.5px}.ch2 b{cursor:pointer;color:var(--mute);padding:0 3px;font-weight:400}
.sg{border:1px solid var(--line2);border-radius:8px;margin-top:4px;background:var(--panel);overflow:hidden}.sg div{padding:6px 10px;cursor:pointer}.sg div:hover{background:var(--bg)}
.act{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:12px;font-size:12px}.act a{color:var(--accent);cursor:pointer;white-space:nowrap}
.hr{padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}#hl{max-height:140px;overflow:auto;margin-top:6px}
.pop.lim #sg,.pop.lim .ch2 b{display:none}.pop.lim label[for=pa]{display:block}
.wdr{display:flex;align-items:center;gap:8px;padding:4px 0}.wdr .ck{flex:1}.dlg .wdr input[type=number]{width:70px}

.track{cursor:cell}
.sl{max-height:260px;overflow:auto;margin-top:8px}.sh{font-size:11px;font-weight:600;color:var(--mute);margin:10px 0 4px;text-transform:uppercase}
.si{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}.si:hover{background:var(--bg)}.si.dis{opacity:.5;cursor:default}.si i{width:10px;height:10px;border-radius:3px;flex:none}
.dlg textarea{width:100%;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:5px 8px;resize:vertical}
.dlg .two{display:flex;gap:8px}.dlg .two>div{flex:1}
.pres{display:flex;align-items:center;margin-left:6px;padding-left:6px}.pres i{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 11px/1 inherit;font-style:normal;color:#fff;margin-left:-6px;border:2px solid var(--panel);box-sizing:border-box}
.rf{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.rf>div{flex:1;min-width:120px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.card b{display:block;font-size:19px;margin:2px 0}
.rt{border-collapse:collapse;width:100%;font-size:12.5px}.rt th,.rt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.rt th:nth-child(-n+3),.rt td:nth-child(-n+3){text-align:left}
.rt thead th{position:sticky;top:0;background:var(--panel);z-index:1;font-size:11.5px;color:var(--mute)}.rt tfoot td{font-weight:700}.rt td.over{color:#c4303f;font-weight:600}
.stk{display:flex;height:10px;width:150px;border-radius:5px;overflow:hidden;background:var(--line)}.stk i{display:block;height:100%}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:8px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
</style>
</head>
<body>
<header>
  <h1>Capacity planner</h1>
  <button id="pane">Hide projects</button><button id="today">Today</button>
  <span class="hint">Drag projects onto a row. Drag bars to move; pull the edges to resize. Click an empty slot to add a project.</span>
  <span class="sp"></span>
  <button id="rep">Reports</button><select id="pf" aria-label="Filter by client or project"></select><select id="srt" aria-label="Sort team"><option value="custom">Sort: added order</option><option value="name">Name A–Z</option><option value="name-desc">Name Z–A</option><option value="title">Job title A–Z</option></select><button id="skb">Skills</button><button id="rrh" title="Reset all row heights">Reset row sizes</button><input id="flt" placeholder="Filter team by name, title or skill" aria-label="Filter team" style="width:250px"><button id="act" hidden>Activity</button><button id="lo" hidden onclick="doLogout()">Sign out</button><button id="usr" hidden>Users</button><span id="status" class="hint">Connecting…</span><span id="pres" class="pres"></span>
</header>
<main>
  <aside>
    <h2 style="display:flex;justify-content:space-between;align-items:center">Clients and projects<span><button class="ed" id="exa" title="Expand all" aria-label="Expand all">▾</button><button class="ed" id="cla" title="Collapse all" aria-label="Collapse all">▸</button></span></h2>
    <div id="projs"></div>
    <div class="add"><input id="nc" placeholder="New client" aria-label="New client name"><button id="addc">Add</button></div>
    <h2>Team (click a name in the chart to edit)</h2>
    <div id="ppl"></div>
    <div class="add"><input id="nm" placeholder="New person" aria-label="New person name"><button id="addm">Add</button></div>
  </aside>
  <div id="scroller"><div id="content"></div></div>
</main>
<script>
const DW=40,BH=34,GAP=4,PAD=6;
const COLORS=['#e8590c','#2f9e44','#1c3a8a','#c2255c','#0c8599','#7048e8','#b08900','#5c6370'];
const KEY='capacity-planner-v1';
const PALETTE=['#c92a2a','#d9480f','#e8590c','#f08c00','#b08900','#74b816','#2f9e44','#099268','#0ca678','#0c8599','#1098ad','#1971c2','#3b5bdb','#1c3a8a','#5f3dc4','#7048e8','#9c36b5','#c2255c','#e64980','#a61e4d','#8d6e63','#5c6370','#868e96','#343a40'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=fmt(new Date());
const wkStart=n=>fmt(new Date(mondayOf(new Date()).getTime()+n*7*864e5+(n*7*864e5?0:0)));
function addDays(iso,n){const d=parse(iso);d.setDate(d.getDate()+n);return fmt(d)}

function seed(){
  const P=[{id:'p1',name:'Spur Corporation',color:COLORS[1]},{id:'p2',name:'Air Products',color:COLORS[3]},{id:'p3',name:'South African Response',color:COLORS[0]},{id:'p4',name:'Internal',color:COLORS[7]},{id:'lv',name:'Leave',leave:true,color:'#9aa1b5'}];
  const T=[{id:'t1',name:'Adrian Masters',role:'Solution Architect',cap:8},{id:'t2',name:'Ivana Naidoo',role:'Delivery Manager',cap:8},{id:'t3',name:'Jakes Gous',role:'Delivery Manager',cap:8},{id:'t4',name:'Jordan Masters',role:'Developer, Jnr',cap:8}];
  const w=n=>addDays(fmt(mondayOf(new Date())),n*7);
  const A=[
   ['t1','p1',w(0),addDays(w(1),4),4],['t1','p4',w(1),addDays(w(2),4),4],['t1','p2',w(3),addDays(w(4),4),6],
   ['t2','p3',w(0),addDays(w(0),4),8],['t2','p1',w(1),addDays(w(2),4),5],['t2','lv',w(4),addDays(w(4),4),8],
   ['t3','p2',w(0),addDays(w(2),4),6],['t3','p4',w(1),addDays(w(1),4),4],['t3','p1',w(3),addDays(w(5),4),8],
   ['t4','p4',w(1),addDays(w(4),4),7]
  ].map(a=>({id:uid(),person:a[0],proj:a[1],start:a[2],end:a[3],hrs:a[4]}));
  return {projects:P,people:T,allocs:A};
}
let state={clients:[],holidays:[],users:[],projects:[],people:[],allocs:[]};
let filterQ='';
let rowH={};try{rowH=JSON.parse(localStorage.getItem('planner-rowh')||'{}')}catch(e){}
const saveRowH=()=>{try{localStorage.setItem('planner-rowh',JSON.stringify(rowH))}catch(e){}};
const ls={get(k,d){try{const v=localStorage.getItem('planner-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('planner-'+k,JSON.stringify(v))}catch(e){}}};
let sortBy=ls.get('sort','custom'),collapsed=ls.get('collapsed',{}),paneHidden=ls.get('pane',false),skillSel=new Set();
let myRole=null,myId=null,me=null,isOwnerFlag=false,usersReady=false,bootWrote=false,usersDraw=null;
const BOOT=[];
const rank={contributor:1,manager:2,admin:3};
let pf='';
const STG={active:'Active',hired:'Hired, starting soon',offer:'Offer made',interview:'Interviewing',screening:'Screening',sourcing:'Sourcing'};
const atLeast=r=>(rank[myRole]||0)>=rank[r];
const matches=p=>(!filterQ||(p.name+' '+(p.role||'')+' '+(p.emp||'')+' '+(p.stage&&p.stage!=='active'?STG[p.stage]:'')+' '+(p.skills||[]).join(' ')).toLowerCase().includes(filterQ))&&(!skillSel.size||(p.skills||[]).some(s=>skillSel.has(s)));
const sortedPeople=()=>{const l=state.people.filter(matches).filter(p=>!pf||state.allocs.some(a=>a.person===p.id&&visAlloc(a)));if(sortBy==='name')l.sort((a,b)=>a.name.localeCompare(b.name));else if(sortBy==='name-desc')l.sort((a,b)=>b.name.localeCompare(a.name));else if(sortBy==='title')l.sort((a,b)=>(a.role||'~').localeCompare(b.role||'~')||a.name.localeCompare(b.name));return l};
let db=null,readOnly=false,synced=false,dirty=false;
function loadLocal(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function setStatus(t){const s=document.getElementById('status');if(s)s.textContent=t}
function fail(e){setStatus('Save failed: '+((e&&(e.message||e.code))||'unknown error'))}
function put(kind,obj){if(!db){saveLocal();return}const r={...obj};delete r.id;db.collection(kind).doc(obj.id).set(r).catch(fail);logChange(kind,obj.id,r)}
function del(kind,id){if(!db){saveLocal();return}db.collection(kind).doc(id).delete().catch(fail);logChange(kind,id,null)}

function ago(t){
  const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';
  const m=Math.round(s/60);if(m<60)return m+(m===1?' minute':' minutes')+' ago';

/* ---------- activity log: who changed what ---------- */
const shadow={};
function describe(kind,id,obj,old){
  const cur=obj||old||{},out=[];
  const pn=i=>{const x=state.people.find(y=>y.id===i);return x?x.name:'someone'};
  const prn=i=>{const x=state.projects.find(y=>y.id===i);return x?labelOf(x):'a project'};
  const chg=k=>old&&obj&&JSON.stringify(old[k])!==JSON.stringify(obj[k]);
  if(kind==='allocs'){
    const w=pn(cur.person),p=prn(cur.proj);
    if(!obj)return `removed ${w} from ${p}`;
    if(!old)return `booked ${w} on ${p} (${obj.hrs}h/day)`;
    if(chg('hrs'))out.push(`changed ${w}'s hours on ${p} from ${old.hrs}h to ${obj.hrs}h/day`);
    if(chg('status'))out.push(`marked ${w} on ${p} as ${obj.status||'confirmed'}`);
    if(chg('comment'))out.push(`edited the comment for ${w} on ${p}`);
    if(chg('person'))out.push(`moved ${p} from ${pn(old.person)} to ${w}`);
    if(chg('proj'))out.push(`changed ${w}'s booking to ${p}`);
    if(chg('start')||chg('end'))out.push(`changed the dates of ${w}'s ${p} booking`);
  }else if(kind==='projects'){
    const n=labelOf(cur);
    if(!obj)return `deleted project ${n}`;
    if(!old)return `added project ${n}`;
    if(chg('start')||chg('end'))out.push(`changed the timeline of ${n} to ${obj.start} – ${obj.end}`);
    if(chg('name'))out.push(`renamed project ${old.name} to ${obj.name}`);
    if(chg('clientId'))out.push(`moved ${obj.name} to another client`);
    if(chg('ownerId'))out.push(`set the owner of ${n} to ${pn(obj.ownerId)}`);
    if(chg('stage'))out.push(`set the stage of ${n} to ${obj.stage}`);
    if(chg('billable'))out.push(`marked ${n} as ${obj.billable===false?'non-billable':'billable'}`);
    if(chg('code'))out.push(`changed the code of ${n}`);
    if(chg('notes'))out.push(`edited the notes for ${n}`);
    if(chg('color')||chg('leave'))out.push(`changed the look of ${n}`);
  }else if(kind==='people'){
    const n=cur.name||'someone';
    if(!obj)return `removed team member ${n}`;
    if(!old)return `added team member ${n}`;
    if(chg('name'))out.push(`renamed ${old.name} to ${obj.name}`);
    if(chg('role'))out.push(`changed the job title of ${n} to ${obj.role||'none'}`);
    if(chg('emp'))out.push(`marked ${n} as ${obj.emp||'permanent'}`);
    if(chg('stage'))out.push(`set the recruitment stage of ${n} to ${STG[obj.stage]||obj.stage}`);
    if(chg('cap'))out.push(`changed the daily capacity of ${n} to ${obj.cap}h`);
    if(chg('days'))out.push(`changed the work days of ${n}`);
    if(chg('skills'))out.push(`changed the skills of ${n}`);
  }else if(kind==='clients'){
    const n=cur.name||'a client';
    if(!obj)return `deleted client ${n}`;
    if(!old)return `added client ${n}`;
    if(chg('name'))out.push(`renamed client ${old.name} to ${obj.name}`);
    if(chg('color'))out.push(`changed the colour of ${n}`);
  }else if(kind==='holidays'){
    return obj?`marked ${id} as a public holiday${obj.name?' ('+obj.name+')':''}`:`removed the public holiday on ${id}`;
  }else if(kind==='users'){
    const n=cur.name||'a user';
    if(!old)return obj.status==='pending'?'requested access':`added ${n} as ${obj.role}`;
    if(chg('status')){if(obj.status==='approved')return `approved ${n} as ${obj.role}`;if(obj.status==='declined')return old.status==='approved'?`removed access for ${n}`:`declined access for ${n}`;return null}
    if(chg('role'))out.push(`changed ${n}'s role from ${old.role} to ${obj.role}`);
  }
  return out.length?out.join('; '):null;
}
function logChange(kind,id,obj){
  const key=kind+'/'+id,old=shadow[key]?JSON.parse(shadow[key]):null;
  if(obj)shadow[key]=JSON.stringify(obj);else delete shadow[key];

function reportRows(R){
  const days=[];for(let d=parse(R.from);fmt(d)<=R.to;d.setDate(d.getDate()+1))days.push(fmt(d));
  const rows=[];
  for(const p of state.people){
    const con=p.emp==='contractor',act=(p.stage||'active')==='active';
    if(R.title&&(p.role||'')!==R.title)continue;
    if(R.emp&&(con?'contractor':'permanent')!==R.emp)continue;
    if(R.status==='active'&&!act)continue;if(R.status==='recruiting'&&act)continue;
    const al=state.allocs.filter(a=>a.person===p.id).map(a=>({a,e:eff(a),pr:proj(a.proj)}));
    const r={p,con,avail:0,cb:0,tb:0,cn:0,tn:0,lv:0,un:0};
    for(const iso of days){
      const cap=holMap[iso]?0:(Number(daysOf(p)[parse(iso).getDay()])||0);
      if(!cap)continue;
      r.avail+=cap;
      for(const x of al){
        if(!x.e.start||iso<x.e.start||iso>x.e.end)continue;
        const h=Number(x.a.hrs)||0;
        if(x.pr&&x.pr.leave){if(con)r.un+=h;else r.lv+=h;continue}
        const bill=!!x.pr&&x.pr.billable!==false&&isLinked(x.pr),ten=x.a.status==='tentative';
        r[(ten?'t':'c')+(bill?'b':'n')]+=h;
      }
    }
    r.booked=r.cb+r.tb+r.cn+r.tn;
    r.free=Math.max(0,r.avail-r.booked-r.lv-r.un);
    r.util=r.avail?Math.round(r.booked/r.avail*100):0;
    rows.push(r);
  }
  return rows;
}

    o.innerHTML=`<div class="dlg" style="width:620px"><h3>Users and roles</h3><label>Waiting for approval</label>${pend.length?pend.map(u=>`<div class="ur">${info(u)}<select data-ar="${u.id}" aria-label="Role">${opts('contributor')}</select><label class="ck"><input type="checkbox" data-at="${u.id}" checked> Add to team chart</label><button class="pri" data-ap="${u.id}">Approve</button><button data-dc="${u.id}">Decline</button></div>`).join(''):'<p class="hint">No requests waiting.</p>'}<label>People with access</label>${acc.map(u=>`<div class="ur">${info(u)}<select data-rr="${u.id}" aria-label="Role">${opts(u.role)}</select><button class="danger" data-rv="${u.id}">Remove access</button></div>`).join('')||'<p class="hint">Nobody yet.</p>'}${dec.length?`<label>Declined</label>${dec.map(u=>`<div class="ur">${info(u)}<button data-ap="${u.id}">Approve as contributor</button></div>`).join('')}`:''}<div class="r"><span class="sp"></span><button data-x>Close</button></div></div>`;
  };
  usersDraw=draw;draw();
  o.addEventListener('pointerdown',e=>{if(e.target===o)closeModal()});
  o.addEventListener('change',e=>{const s=e.target.closest('[data-rr]');if(!s)return;const u=state.users.find(x=>x.id===s.dataset.rr);if(!u)return;if(u.role==='admin'&&s.value!=='admin'&&admins()<2){s.value='admin';setStatus('There must be at least one admin.');return}u.role=s.value;saveUser(u);evalAccess();draw()});
  o.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;const d=b.dataset;
    if(b.hasAttribute('data-x')){closeModal();return}
    const id=d.ap||d.dc||d.rv;const u=state.users.find(x=>x.id===id);if(!u)return;
    if(d.ap){const sel=o.querySelector('[data-ar="'+id+'"]'),at=o.querySelector('[data-at="'+id+'"]');u.status='approved';u.role=sel?sel.value:'contributor';
      if(at&&at.checked&&!state.people.some(p=>p.userId===id)){const p={id:uid(),name:u.name,role:u.jobTitle||'',cap:8,skills:[],userId:id,n:Date.now()};state.people.push(p);put('people',p)}}
    else if(d.dc){u.status='declined'}
    else if(d.rv){if(u.role==='admin'&&admins()<2){setStatus('There must be at least one admin.');return}u.status='declined';u.role=null}
    saveUser(u);evalAccess();draw();
  });
}

  const d=parse(iso);if(d.getDay()===0||d.getDay()===6)return;
  closePop();const h=state.holidays.find(x=>x.id===iso);
  const p=document.createElement('div');p.className='pop';
  p.innerHTML=`<b>${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b><label for="hn">Holiday name (optional)</label><input id="hn" value="${esc(h?h.name:'')}" placeholder="e.g. Heritage Day"><div class="r">${h?'<button id="hx" class="danger">Remove holiday</button>':''}<span class="sp"></span><button id="hs" class="pri">${h?'Save':'Mark as public holiday'}</button></div>`;
  document.body.appendChild(p);
  p.style.left=Math.max(8,Math.min(e.clientX,innerWidth-250))+'px';p.style.top=(e.clientY+14)+'px';
  const nm=p.querySelector('#hn');nm.focus();
  nm.onkeydown=ev=>{if(ev.key==='Enter')p.querySelector('#hs').click()};
  p.querySelector('#hs').onclick=()=>{const o={id:iso,name:nm.value.trim()};state.holidays=state.holidays.filter(x=>x.id!==iso).concat(o);put('holidays',o);closePop();render()};
  const x=p.querySelector('#hx');if(x)x.onclick=()=>{state.holidays=state.holidays.filter(y=>y.id!==iso);del('holidays',iso);closePop();render()};
}

let rh=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.rh');if(!h)return;e.preventDefault();rh={id:h.dataset.rh,y:e.clientY,h:h.closest('.row').offsetHeight}});

/* ---------- Vercel version: login page and connector to /api ---------- */
let session=null;
const API=async(path,body)=>{
  const r=await fetch(path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&session){location.reload()}
  if(!r.ok)throw Object.assign(new Error(j.error||('HTTP '+r.status)),{code:r.status});
  return j;
};
function makeDB(){
  let rev=-1,store={},loaded=false,timer=null;const subs=[];
  const docsOf=(coll,o)=>{
    let a=Object.entries(store[coll]||{}).map(([id,v])=>({id,data:()=>v}));
    if(o&&o.by)a.sort((x,y)=>{const p=x.data()[o.by],q=y.data()[o.by];return(o.dir==='desc'?-1:1)*(p>q?1:p<q?-1:0)});
    if(o&&o.n)a=a.slice(0,o.n);
    return a;
  };
  const fire=()=>subs.forEach(s=>s.cb({docs:docsOf(s.coll,s.o)}));
  const poll=async()=>{
    try{const j=await API('/api/data?rev='+rev);
      if(j.online)showPresence(j.online);if(j.changed){store=j.data;rev=j.rev;loaded=true;fire()}else if(!loaded){loaded=true;fire()}}
    catch(e){subs.forEach(s=>s.err&&s.err(e))}
  };
  const soon=()=>{clearTimeout(timer);timer=setTimeout(poll,500)};
  const write=async ops=>{try{await API('/api/data',{ops})}catch(e){rev=-1;poll();throw e}soon()};
  const coll=(name,o={})=>({
    doc:id=>({
      set:obj=>{(store[name]=store[name]||{})[id]=obj;fire();return write([{op:'set',coll:name,id,data:obj}])},
      delete:()=>{if(store[name])delete store[name][id];fire();return write([{op:'delete',coll:name,id}])}
    }),
    onSnapshot:(cb,err)=>{subs.push({coll:name,o,cb,err});if(loaded)cb({docs:docsOf(name,o)});return()=>{}},
    orderBy:(by,dir)=>coll(name,{...o,by,dir}),
    limit:n=>coll(name,{...o,n})
  });
  poll();
  setInterval(()=>{if(!document.hidden)poll()},5000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  return{collection:n=>coll(n)};
}
function startApp(){
  window.claude={use:async n=>n==='db'?makeDB():{id:async()=>session.id,me:async()=>({name:session.name,email:session.username}),isOwner:async()=>false,can:async()=>true}};
  document.getElementById('lo').hidden=false;
  connect();
}
async function doLogout(){try{await API('/api/auth',{action:'logout'})}catch(e){}location.reload()}
function showLogin(){
  let o=document.getElementById('login');if(o)o.remove();
  o=document.createElement('div');o.id='login';o.className='ov-modal';o.style.cssText='z-index:95;background:var(--bg)';document.body.appendChild(o);
  let mode='in';
  const draw=()=>{
    o.innerHTML=`<div class="dlg"><h3>Capacity planner</h3><div class="seg" id="lm" style="margin:10px 0"><button data-m="in" class="${mode==='in'?'on':''}">Log in</button><button data-m="up" class="${mode==='up'?'on':''}">Create account</button></div><label>Username</label><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"><label>Password</label><input id="lp" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}">${mode==='up'?'<label>Full name</label><input id="ln" autocomplete="name"><label>Job title</label><input id="lj"><p class="hint">New accounts must be approved by an admin before you can see the plan.</p>':''}<p class="hint" id="lmsg" role="alert"></p><div class="r"><span class="sp"></span><button class="pri" id="lgo">${mode==='in'?'Log in':'Create account'}</button></div></div>`;
    o.querySelector('#lm').onclick=e=>{const b=e.target.closest('button');if(b){mode=b.dataset.m;draw()}};
    const go=async()=>{
      const body={action:mode==='in'?'login':'signup',username:o.querySelector('#lu').value,password:o.querySelector('#lp').value};
      if(mode==='up'){body.name=o.querySelector('#ln').value;body.jobTitle=o.querySelector('#lj').value}
      const btn=o.querySelector('#lgo'),msg=o.querySelector('#lmsg');btn.disabled=true;msg.textContent='';
      try{const j=await API('/api/auth',body);session=j.user;o.remove();startApp()}
      catch(e){msg.textContent=e.message;btn.disabled=false}
    };
    o.querySelector('#lgo').onclick=go;
    o.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
    o.querySelector('#lu').focus();
  };
  draw();
}
async function boot(){
  try{session=(await API('/api/auth',{action:'me'})).user}catch(e){session=null}
  if(session)startApp();else showLogin();
}
render();goToday();boot();
